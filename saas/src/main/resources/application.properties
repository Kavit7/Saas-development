spring.config.import=optional:file:.env[.properties]
spring.application.name=saas

# OpenAPI / Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# OpenAPI JSON
springdoc.api-docs.path=/v3/api-docs

# Swagger UI
springdoc.swagger-ui.path=/docs
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}



spring.mail.host=${MAIL_SMTP_HOST}
spring.mail.port=${MAIL_SMTP_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

mail.imap.host=${MAIL_IMAP_HOST}
mail.imap.port=${MAIL_IMAP_PORT}
mail.imap.username=${MAIL_USERNAME}
mail.imap.password=${MAIL_PASSWORD}

# Gemini Studio AI Document Reader Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-3.8-flash}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models

# ===================================================================
# File Storage Configuration (Local Disk vs Cloudflare R2 Object Storage)
# ===================================================================
# Storage provider type: 'local' (development) or 'r2' / 's3' (production hosting)
app.storage.type=${STORAGE_TYPE:local}

# Local filesystem storage directory (used when app.storage.type=local)
app.upload.dir=${UPLOAD_DIR:uploads}

# Cloudflare R2 / S3 Object Storage Configuration (used when app.storage.type=r2)
app.storage.r2.account-id=${R2_ACCOUNT_ID:}
app.storage.r2.bucket-name=${R2_BUCKET_NAME:}
app.storage.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.storage.r2.endpoint=${R2_ENDPOINT:}
app.storage.r2.public-url=${R2_PUBLIC_URL:}

# Automated Payment Deadline Reminders (Daily 8:00 AM server time)
app.scheduling.payment-reminder-cron=0 0 8 * * ?

# ===================================================================
# Data Seeding & Security Control Configuration
# ===================================================================
# Master switch for data seeding on application startup.
# In PRODUCTION, keep this 'false' to prevent exposing default accounts or altering existing data.
# Set to 'true' only when initializing a new environment.
app.seed.enabled=${APP_SEED_ENABLED:false}

# Controls whether mock/sample entities (demo companies, safari itineraries, mock clients) are seeded.
# For production hosting, keep this 'false'. For local development/testing, set to 'true'.
app.seed.sample-data=${APP_SEED_SAMPLE_DATA:false}

# Universal password for mock/sample development accounts.
app.seed.default-password=${APP_SEED_DEFAULT_PASSWORD:Password123!}

# Initial Platform Super Admin credentials (used only when app.seed.enabled=true)
app.seed.super-admin.email=${APP_SEED_SUPER_ADMIN_EMAIL:superadmin@platform.com}
app.seed.super-admin.password=${APP_SEED_SUPER_ADMIN_PASSWORD:}
app.seed.super-admin.first-name=${APP_SEED_SUPER_ADMIN_FIRST_NAME:Platform}
app.seed.super-admin.last-name=${APP_SEED_SUPER_ADMIN_LAST_NAME:SuperAdmin}
app.seed.super-admin.phone=${APP_SEED_SUPER_ADMIN_PHONE:+255 700 000 001}
