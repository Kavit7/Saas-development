spring.config.import=optional:file:.env[.properties]
spring.application.name=saas
# OpenAPI / Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# OpenAPI JSON
springdoc.api-docs.path=/v3/api-docs

# Swagger UI
springdoc.swagger-ui.path=/docs
spring.datasource.url=jdbc:postgresql://localhost:5432/saas_db
spring.datasource.username=postgres
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}



spring.mail.host=${MAIL_SMTP_HOST}
spring.mail.port=${MAIL_SMTP_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

mail.imap.host=${MAIL_IMAP_HOST}
mail.imap.port=${MAIL_IMAP_PORT}
mail.imap.username=${MAIL_USERNAME}
mail.imap.password=${MAIL_PASSWORD}